name: Check library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    env:
      INK_LANDSCAPE_ARTIFACT_DIR: ${{ runner.temp }}/ink-landscape-library-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run learning:build
      - name: Check generated reading data
        run: git diff --exit-code -- src/technique-learning.ts docs/learning
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-node-${{ matrix.node }}
          path: |
            ${{ env.INK_LANDSCAPE_ARTIFACT_DIR }}/browser-*/report.json
            ${{ env.INK_LANDSCAPE_ARTIFACT_DIR }}/browser-*/verification.png
            ${{ env.INK_LANDSCAPE_ARTIFACT_DIR }}/browser-*/error.txt
            ${{ env.INK_LANDSCAPE_ARTIFACT_DIR }}/package-*/report.json
            ${{ env.INK_LANDSCAPE_ARTIFACT_DIR }}/package-*/error.txt
          if-no-files-found: ignore
